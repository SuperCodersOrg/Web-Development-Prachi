<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Student Registration Form</title>
</head>
<body>
    <div id="mainPage">
            <table id="reg">
                <form method="post" action="/registerstudents">
                    <!-- <p>Please enter your personal details</p> -->
                    <tr>
                        <td><label for="firstname">First Name:*</label></td>

                        <td><input type="text" id="firstname" name="firstName" placeholder="enter first name" /></td>
                    </tr>

                    <tr>
                        <td><label for="Lastname">Last Name:*</label></td>

                        <td><input type="text" id="Lastname" name="Lastname" required /></td>
                    </tr>
                    <tr>
                        <td><label for="streetaddress">Street Address:</label></td>

                        <td><input type="text" name="streetaddress" id="streetaddress" /></td>
                    </tr>
                    <tr>
                        <td><label for="Town/City">Town/City:</label></td>

                        <td><input type="text" name="Town/City" id="Town/City" />
                    </tr>
                    </td>
                    </tr>
                    <tr>
                        <td><label for="Postcode/Zip">Postcode/Zip:</label></td>
                        <td><input type="text" name="Postcode/Zip" id="Postcode/Zip" /></td>
                    </tr>
                    <tr>
                        <td><label for="Telephone">Telephone:</label></td>
                        <td><input type="text" name="Telephone" id="Telephone" /></td>
                    </tr>
                    <tr>
                        <td><label for="Mobile">Mobile:</label></td>
                        <td><input type="text" name="Mobile" id="Mobile" /></td>
                    </tr>
                    <tr>
                        <td><label for="email">Email:*</label></td>
                        <td><input type="email" name="email" id="email" /></td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <p>Fields marked * are required.</p>
                        </td>
                    </tr>
                    <tr>
                        <td colspan="2">
                            <center><input type="submit" id="submit" /></center>
                        </td>
                    </tr>
                </form>
            </table>

        </div>
        <script>
            function handlingForm(){
let firstName=document.getElementById("firstname");
let Lastname=document.getElementById("Lastname");
let streetaddress=document.getElementById("streetaddress");
let Town=document.getElementById("Town/City");

let Postcode=document.getElementById("Postcode/Zip");
let Telephone=document.getElementById("Telephone");
let Mobile=document.getElementById("Mobile");
let email=document.getElementById("email");

let submit=document.getElementById("submit");
console.log(submit);
submit.addEventListener("click",(event)=>{
event.preventDefault();
console.log("event hodden");
let obj={
    fname: firstName.value,
    streetAdd: streetaddress.value,
    postcode: Postcode.value,
    mobile: Mobile.value,
    email: email.value,
}
console.log(obj);

fetch(`http://localhost:3500/registerstudents`,{
    method: "POST",
    headers: {
        "Content-Type": "application/json",
    },
    body: JSON.stringify(obj)
})
.then((res,err)=>{
    if(res){
       console.log(res);
    }
    else{
        console.log(err);
    }
})

})
}
handlingForm();
        </script>
        <script src="style.js"></script>
</body>
</html>
